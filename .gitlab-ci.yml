stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "registry.gitlab.com/$CI_PROJECT_PATH/meu_flask"

build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME .
  only:
    - main

test:
  stage: test
  script:
    - docker run $IMAGE_NAME pytest  # coloque seu comando de testes aqui
  only:
    - merge_requests

deploy:
  stage: deploy
  script:
    - docker push $IMAGE_NAME
    # aqui você coloca o deploy real, ex: ssh, kubernetes, docker swarm, etc.
  only:
    - tags