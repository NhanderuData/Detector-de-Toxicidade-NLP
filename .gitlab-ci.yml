image: docker:latest

services:
  - docker:dind

stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/meu_flask:latest"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - main
    - merge_requests  

test:
  stage: test
  script:
    - docker pull $IMAGE_NAME
    - docker run $IMAGE_NAME pytest
  only:
    - merge_requests

deploy:
  stage: deploy
  script:
    - docker pull $IMAGE_NAME || docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
    - echo "Deploying application..." 
  only:
    - tags